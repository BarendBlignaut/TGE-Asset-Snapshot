<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGE Asset Snapshot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      line-height: 1.4;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
 
    .version-box {
      border: 1px solid #ccc;
      padding: 8px 12px;
      background: #f7f7f7;
      font-size: 14px;
    }

    form {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      width: 240px;
      margin-right: 8px;
    }

    button {
      padding: 10px 14px;
      cursor: pointer;
    }

    #status {
      margin: 16px 0;
      font-weight: bold;
    }

    .summary {
      border: 1px solid #ccc;
      padding: 16px;
      margin-bottom: 20px;
      background: #f8f8f8;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .image-card {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      background: #fafafa;
    }

    .image-card img {
      width: 100%;
      height: auto;
      display: block;
      margin-top: 10px;
      border-radius: 4px;
      background: #eee;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>TGE Asset Snapshot</h1>
    <div class="version-box">Frontend Version: 2.0</div>
  </div>

  <form id="vehicleForm">
    <input id="vehicleId" type="text" placeholder="Enter vehicle ID" required />
    <button type="submit">Load Latest Snapshot</button>
  </form>

  <div id="status"></div>
  <div id="result"></div>

  <script>
    const form = document.getElementById("vehicleForm");
    const vehicleIdInput = document.getElementById("vehicleId");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const vehicleId = vehicleIdInput.value.trim();
      resultBox.innerHTML = "";

      if (!vehicleId) {
        statusBox.textContent = "Please enter a vehicle ID.";
        return;
      }

      statusBox.textContent = "Loading latest snapshot...";

      try {
        const response = await fetch("/api/events?vehicleId=" + encodeURIComponent(vehicleId));
        const data = await response.json();

        if (!response.ok) {
          statusBox.textContent = data.error || "Request failed.";
          return;
        }

        statusBox.textContent = "Latest snapshot loaded.";

        const summaryHtml = `
          <div class="summary">
            <div><strong>Frontend Version:</strong> 2.0</div>
            <div><strong>Backend Version:</strong> ${escapeHtml(data.version)}</div>
            <div><strong>Vehicle ID:</strong> ${escapeHtml(data.vehicleId)}</div>
            <div><strong>Event ID:</strong> ${escapeHtml(data.eventId)}</div>
            <div><strong>Created At:</strong> ${escapeHtml(data.createdAt)}</div>
            <div><strong>Snapshot Time:</strong> ${escapeHtml(data.timeAt)}</div>
            <div><strong>Images Found:</strong> ${escapeHtml(data.imageCount)}</div>
          </div>
        `;

        const galleryHtml = data.images.map(function (image) {
          return `
            <div class="image-card">
              <div><strong>Camera ${escapeHtml(image.cameraNumber)}:</strong> ${escapeHtml(image.label)}</div>
              <img src="${escapeHtml(image.url)}" alt="${escapeHtml(image.label)}" />
            </div>
          `;
        }).join("");

        resultBox.innerHTML = summaryHtml + `<div class="gallery">${galleryHtml}</div>`;
      } catch (error) {
        statusBox.textContent = "Failed to load snapshot.";
      }
    });
  </script>
</body>
</html>
