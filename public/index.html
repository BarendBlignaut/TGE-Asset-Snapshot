<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGE Asset Snapshot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      line-height: 1.4;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .version-box {
      border: 1px solid #ccc;
      padding: 8px 12px;
      background: #f7f7f7;
      font-size: 14px;
    }

    form {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      width: 240px;
      margin-right: 8px;
    }

    button {
      padding: 10px 14px;
      cursor: pointer;
    }

    #status {
      margin: 16px 0;
      font-weight: bold;
    }

    .summary {
      border: 1px solid #ccc;
      padding: 16px;
      margin-bottom: 20px;
      background: #f8f8f8;
    }

    .link-list {
      margin-bottom: 24px;
    }

    .link-card {
      border: 1px solid #ccc;
      padding: 12px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .link-label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .url-box {
      word-break: break-all;
      font-size: 12px;
      margin-top: 8px;
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .image-card {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      background: #fafafa;
    }

    .image-card img {
      width: 100%;
      height: auto;
      display: block;
      margin-top: 10px;
      border-radius: 4px;
      background: #eee;
    }

    .result-note {
      margin-top: 8px;
      font-size: 13px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>TGE Asset Snapshot</h1>
    <div class="version-box">Frontend Version: 1.2</div>
  </div>

  <form id="vehicleForm">
    <input id="vehicleId" type="text" placeholder="Enter vehicle ID" required />
    <button type="submit">Check Vehicle Images</button>
  </form>

  <div id="status"></div>
  <div id="result"></div>

  <script>
    const form = document.getElementById("vehicleForm");
    const vehicleIdInput = document.getElementById("vehicleId");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const vehicleId = vehicleIdInput.value.trim();

      if (!vehicleId) {
        statusBox.textContent = "Please enter a vehicle ID.";
        resultBox.innerHTML = "";
        return;
      }

      statusBox.textContent = "Loading...";
      resultBox.innerHTML = "";

      try {
        const response = await fetch(
          "/api/events?vehicleId=" + encodeURIComponent(vehicleId)
        );

        const data = await response.json();

        if (!response.ok) {
          statusBox.textContent = data.error || "Request failed.";
          resultBox.innerHTML = `
            <div class="summary">
              <div><strong>Frontend Version:</strong> 1.2</div>
              <div><strong>Backend Version:</strong> ${escapeHtml(data.version || "unknown")}</div>
            </div>
          `;
          return;
        }

        statusBox.textContent = "Vehicle found and camera extraction completed.";

        const summaryHtml = `
          <div class="summary">
            <div><strong>Frontend Version:</strong> 1.2</div>
            <div><strong>Backend Version:</strong> ${escapeHtml(data.version)}</div>
            <div><strong>Requested Vehicle ID:</strong> ${escapeHtml(data.requestedVehicleId)}</div>
            <div><strong>Matched Vehicle ID:</strong> ${escapeHtml(data.matchedVehicleId)}</div>
            <div><strong>Event ID:</strong> ${escapeHtml(data.eventId)}</div>
            <div><strong>Event Time:</strong> ${escapeHtml(data.eventTime)}</div>
            <div><strong>Context Present:</strong> ${data.hasContext ? "Yes" : "No"}</div>
            <div><strong>Extraction Method:</strong> ${escapeHtml(data.extractionMethod)}</div>
            <div><strong>Images Found:</strong> ${escapeHtml(data.imageCount)}</div>
          </div>
        `;

        const linksHtml = data.images.map(function (image) {
          const safeLabel = escapeHtml(image.label);
          const safeUrl = escapeHtml(image.rawUrl);

          return `
            <div class="link-card">
              <div class="link-label">Camera ${escapeHtml(image.cameraNumber)}: ${safeLabel}</div>
              <div><a href="${safeUrl}" target="_blank" rel="noopener noreferrer">Open image in new tab</a></div>
              <div class="url-box">${safeUrl}</div>
            </div>
          `;
        }).join("");

        const galleryHtml = data.images.map(function (image) {
          const safeLabel = escapeHtml(image.label);
          const safeUrl = escapeHtml(image.rawUrl);

          return `
            <div class="image-card">
              <div><strong>Camera ${escapeHtml(image.cameraNumber)}:</strong> ${safeLabel}</div>
              <img
                src="${safeUrl}"
                alt="${safeLabel}"
                onload="this.nextElementSibling.textContent='Preview loaded in page.'"
                onerror="this.nextElementSibling.textContent='Preview failed in page.'"
              />
              <div class="result-note">Checking preview...</div>
            </div>
          `;
        }).join("");

        resultBox.innerHTML =
          summaryHtml +
          `<h2>Extracted Image Links</h2>` +
          `<div class="link-list">${linksHtml}</div>` +
          `<h2>Image Previews</h2>` +
          `<div class="gallery">${galleryHtml}</div>`;

        if (!data.images.length) {
          statusBox.textContent = "Vehicle found, but zero image links were extracted.";
        }
      } catch (error) {
        statusBox.textContent = "Failed to load vehicle data.";
        resultBox.innerHTML = "";
      }
    });
  </script>
</body>
</html>
